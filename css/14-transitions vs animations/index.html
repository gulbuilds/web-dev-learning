<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>CSS Animations and Transition</title>
</head>
<body>
  <h1>Animation & Transition</h1>
  
  <!-- 1. TRANSITION EXAMPLE: change effect from one state to another  -->
  <button class="btn-transition">Hover Me - Transition</button>
  <button class="btn"  >Click me</button>
  <!-- 2. ANIMATION EXAMPLE: automatic move -->
  <div class="box-spin"></div>
  
  <!-- 3. BOUNCE ANIMATION -->
  <button class="btn-bounce">Click Me - Bounce</button>
</body>
</html>
