<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typography & Color Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Heading 1 - Main Title</h1>
    <h2>Heading 2 - Sub Title</h2>
    <h3>Heading 3 - Section Title</h3>
    
    <p>
      This is a paragraph to test readability. CSS typography controls how text looks and feels. 
      Keep line-height around 1.6 and max-width around 65 characters for comfortable reading.
    </p>

    <div class="color-boxes">
      <div class="box hex">Hex Color</div>
      <div class="box rgb">RGB Color</div>
      <div class="box hsl">HSL Color</div>
      <div class="box var">CSS Variable</div>
    </div>
  </div>
</body>
</html>
