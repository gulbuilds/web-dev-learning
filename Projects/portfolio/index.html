<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mobile responsive meta tag  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title> gulbuilds - Portfolio</title>
</head>
<body>
  <!-- NAVBAR: Uses Flexbox for horizontal layout -->
  <nav class="navbar">
    <div class="logo">gulbuilds</div>
    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <!-- HERO SECTION: Flexbox used for perfect centering -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h1>Hi, I'm gulbuilds</h1>
      <p>Web Developer | Learning CSS</p>
      <button class="btn-primary">Hire Me</button>
    </div>
  </section>

  <!-- SKILLS SECTION: CSS Grid for card layout + Responsive -->
  <section id="skills" class="skills">
    <h2>My Skills</h2>
    <div class="skills-grid">
      <div class="skill-card">
        <h3>HTML</h3>
        <p>Structure of web pages</p>
      </div>
      <div class="skill-card">
        <h3>CSS</h3>
        <p>Styling and layout</p>
      </div>
      <div class="skill-card">
        <h3>JavaScript</h3>
        <p>Adding interactivity</p>
      </div>
      <div class="skill-card">
        <h3>Responsive</h3>
        <p>Mobile friendly design</p>
      </div>
    </div>
  </section>

  <!-- CONTACT FORM: Uses :focus and :invalid pseudo-classes -->
  <section id="contact" class="contact">
    <h2>Get In Touch</h2>
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your Name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="btn-primary">Send Message</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 gulbuilds Built with HTML + CSS</p>
  </footer>
</body>
</html>
